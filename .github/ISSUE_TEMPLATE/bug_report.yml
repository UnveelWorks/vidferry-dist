name: Bug report
description: Something went wrong while using Vidferry
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. The more detail you add, the faster we can fix it.
  - type: input
    id: version
    attributes:
      label: Vidferry version
      description: Find it in Settings, or in the installer file name.
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Video link (optional)
      description: The URL you were trying to save, if you are comfortable sharing it.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, error messages, or steps to reproduce.
